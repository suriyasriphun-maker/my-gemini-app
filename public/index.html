<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px 24px; font-size: 20px; font-weight: 700; background-color: #ffffff; border-bottom: 1px solid #e2e8f0; }
    header span { background: linear-gradient(135deg, #0284c7, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .message { display: flex; gap: 10px; max-width: 90%; line-height: 1.5; font-size: 14px; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot { align-self: flex-start; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
    .user .avatar { background-color: #0284c7; color: #ffffff; }
    .bot .avatar { background: linear-gradient(135deg, #38bdf8, #2563eb); color: #ffffff; }
    .bubble { padding: 12px 16px; border-radius: 16px; word-break: break-word; white-space: pre-wrap; }
    .user .bubble { background-color: #e0f2fe; color: #0369a1; border-top-right-radius: 4px; }
    .bot .bubble { background-color: #ffffff; color: #1e293b; border: 1px solid #e2e8f0; border-top-left-radius: 4px; }
    .input-container { padding: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .input-box { display: flex; align-items: center; background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 28px; padding: 6px 12px 6px 16px; }
    .input-box:focus-within { border-color: #0284c7; }
    input { flex: 1; background: transparent; border: none; outline: none; color: #0f172a; font-size: 15px; padding: 6px 0; }
    button { background: linear-gradient(135deg, #0284c7, #2563eb); border: none; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <header><span>Gemini</span> AI Assistant</header>
  <div class="chat-container" id="chatContainer">
    <div class="message bot">
      <div class="avatar">✨</div>
      <div class="bubble">สวัสดีครับ ผมคือผู้ช่วยอัจฉริยะ Gemini พร้อมให้บริการแล้วครับ มีอะไรให้ผมช่วยเหลือวันนี้ไหมครับ?</div>
    </div>
  </div>
  <div class="input-container">
    <div class="input-box">
      <input type="text" id="userInput" placeholder="พิมพ์ข้อความสนทนา..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">ส่ง</button>
    </div>
  </div>
  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      const chatContainer = document.getElementById('chatContainer');
      appendMessage('user', 'U', text);
      input.value = '';
      const loadingDiv = appendMessage('bot', '✨', 'กำลังประมวลผล...');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        if (response.ok) {
          loadingDiv.querySelector('.bubble').innerText = data.reply;
        } else {
          loadingDiv.querySelector('.bubble').innerText = `⚠️ ${data.error}`;
        }
      } catch (err) {
        loadingDiv.querySelector('.bubble').innerText = '⚠️ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    function appendMessage(sender, avatarText, content) {
      const chatContainer = document.getElementById('chatContainer');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerHTML = `<div class="avatar">${avatarText}</div><div class="bubble">${content}</div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
